name: Public Site

on:
  pull_request:
    paths:
      - "web/**"
      - "scripts/validate_public_site.py"
      - ".github/workflows/public-site.yml"
      - ".github/workflows/publish-whitepaper.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/validate_public_site.py"
      - ".github/workflows/public-site.yml"
      - ".github/workflows/publish-whitepaper.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANTHESIS_SOURCE_COMMIT: 8d02162fa9a4ab027592fd1da81a8ebfb05e7a5d

jobs:
  publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Check publication state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          needed=true
          if [[ -f web/anthesis.pdf.manifest.json ]]; then
            current_commit="$(python -c 'import json; print(json.load(open("web/anthesis.pdf.manifest.json"))["source_commit"])')"
            if [[ "${current_commit}" == "${ANTHESIS_SOURCE_COMMIT}" ]]; then
              needed=false
            fi
          fi
          echo "needed=${needed}" >> "${GITHUB_OUTPUT}"

      - name: Checkout pinned Anthesis source
        if: steps.state.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          repository: hackelia-micrantha/anthesis
          ref: ${{ env.ANTHESIS_SOURCE_COMMIT }}
          path: .publisher/anthesis
          persist-credentials: false

      - name: Install PDF toolchain
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install --disable-pip-version-check "pyyaml==6.0.2"

      - name: Build and verify curated whitepaper
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python .publisher/anthesis/plugins/docs/scripts/build_whitepaper.py \
            --repo-root .publisher/anthesis \
            --config plugins/docs/config/defaults.yaml \
            --pdf-engine xelatex
          install -m 0644 .publisher/anthesis/plugins/docs/outputs/exports/anthesis.pdf web/anthesis.pdf
          install -m 0644 .publisher/anthesis/plugins/docs/outputs/exports/anthesis.pdf.manifest.json web/anthesis.pdf.manifest.json
          python scripts/validate_public_site.py

      - name: Commit generated artifact
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/anthesis.pdf web/anthesis.pdf.manifest.json
          if git diff --cached --quiet; then
            echo "No generated artifact change."
            exit 0
          fi
          git commit -m "docs: publish curated Anthesis whitepaper"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  validate:
    needs: publish
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false
      - name: Validate public site content contract
        run: python scripts/validate_public_site.py
