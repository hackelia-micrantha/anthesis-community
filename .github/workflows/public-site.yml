name: Public Site

on:
  pull_request:
    paths:
      - "web/**"
      - "publication/**"
      - "scripts/validate_public_site.py"
      - ".github/workflows/public-site.yml"
      - ".github/workflows/publish-whitepaper.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "publication/**"
      - "scripts/validate_public_site.py"
      - ".github/workflows/public-site.yml"
      - ".github/workflows/publish-whitepaper.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANTHESIS_SOURCE_COMMIT: 8d02162fa9a4ab027592fd1da81a8ebfb05e7a5d
  ANTHESIS_SOURCE_SHA256: 483918a6dbc1eef0b7199ab3af26f30984c818fd5bd08973f834d21bd65b6fe0

jobs:
  publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Verify pinned source snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo "${ANTHESIS_SOURCE_SHA256}  publication/anthesis-whitepaper.md" | sha256sum --check --strict

      - name: Install PDF toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Build curated whitepaper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .publisher
          python - <<'PY'
          from pathlib import Path
          source = Path("publication/anthesis-whitepaper.md").read_text(encoding="utf-8")
          source = source.replace("# Anthesis Whitepaper", "\\section*{Anthesis Whitepaper}", 1)
          Path(".publisher/staged.md").write_text(
              "\\pdfbookmark[1]{Anthesis Whitepaper}{doc:anthesis_whitepaper_0}\n\n" + source,
              encoding="utf-8",
          )
          Path(".publisher/footer.tex").write_text(
              "\\usepackage{fancyhdr}\n"
              "\\pagestyle{fancy}\n"
              "\\fancyhf{}\n"
              "\\fancyfoot[C]{All rights reserved © Micrantha 2026}\n"
              "\\renewcommand{\\headrulewidth}{0pt}\n"
              "\\renewcommand{\\footrulewidth}{0pt}\n",
              encoding="utf-8",
          )
          PY
          pandoc --from markdown \
            --output web/anthesis.pdf \
            --pdf-engine xelatex \
            --standalone \
            -M 'title=Anthesis: Governed Execution for Agentic Systems' \
            --include-in-header .publisher/footer.tex \
            .publisher/staged.md
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          def sha(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          metadata = {
              "schema_version": 1,
              "artifact": "anthesis.pdf",
              "artifact_sha256": sha("web/anthesis.pdf"),
              "source_commit": "8d02162fa9a4ab027592fd1da81a8ebfb05e7a5d",
              "manifest": "docs/anthesis/overview/whitepaper-manifest.json",
              "manifest_sha256": "6ba7684c7697cec1ce66206d777eae1d63e6cd6e7b6e0f99fa15b3fe988e82df",
              "sources": [{
                  "path": "docs/anthesis/overview/anthesis-whitepaper.md",
                  "sha256": sha("publication/anthesis-whitepaper.md"),
              }],
          }
          Path("web/anthesis.pdf.manifest.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          pdfinfo web/anthesis.pdf | grep -F 'Pages:           9'
          python scripts/validate_public_site.py

      - name: Commit generated artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/anthesis.pdf web/anthesis.pdf.manifest.json
          if git diff --cached --quiet; then
            echo "No generated artifact change."
            exit 0
          fi
          git commit -m "docs: publish curated Anthesis whitepaper"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  validate:
    needs: publish
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false
      - name: Validate public site content contract
        run: python scripts/validate_public_site.py
