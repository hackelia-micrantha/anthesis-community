name: Phyllotaxis Cloudflare Preview

on:
  push:
    branches:
      - ab/phyllotaxis-cloudflare-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anthesis-phyllotaxis-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phyllotaxis-preview
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Wrangler without package scripts
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.114.0

      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          ./node_modules/.bin/wrangler deploy --config wrangler.toml --name anthesis-community-phyllotaxis-preview
