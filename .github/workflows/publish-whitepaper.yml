name: Publish Whitepaper

on:
  push:
    paths:
      - ".github/workflows/publish-whitepaper.yml"
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full Anthesis source commit to publish
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-whitepaper-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFAULT_ANTHESIS_SOURCE_COMMIT: 8d02162fa9a4ab027592fd1da81a8ebfb05e7a5d

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_commit="${{ github.event.inputs.source_commit }}"
          if [[ -z "${source_commit}" ]]; then
            source_commit="${DEFAULT_ANTHESIS_SOURCE_COMMIT}"
          fi
          if [[ ! "${source_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source commit must be a full lowercase Git SHA" >&2
            exit 1
          fi
          echo "commit=${source_commit}" >> "${GITHUB_OUTPUT}"

      - name: Checkout publication repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout pinned Anthesis source
        uses: actions/checkout@v4
        with:
          repository: hackelia-micrantha/anthesis
          ref: ${{ steps.source.outputs.commit }}
          path: .publisher/anthesis
          persist-credentials: false

      - name: Install PDF toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pandoc \
            poppler-utils \
            texlive-latex-extra \
            texlive-xetex
          python -m pip install --disable-pip-version-check "pyyaml==6.0.2"

      - name: Build curated artifact
        shell: bash
        run: |
          set -euo pipefail
          python .publisher/anthesis/plugins/docs/scripts/build_whitepaper.py \
            --repo-root .publisher/anthesis \
            --config plugins/docs/config/defaults.yaml \
            --pdf-engine xelatex
          install -m 0644 \
            .publisher/anthesis/plugins/docs/outputs/exports/anthesis.pdf \
            web/anthesis.pdf
          install -m 0644 \
            .publisher/anthesis/plugins/docs/outputs/exports/anthesis.pdf.manifest.json \
            web/anthesis.pdf.manifest.json

      - name: Verify artifact and trace metadata
        env:
          EXPECTED_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          pdf = Path("web/anthesis.pdf")
          manifest_path = Path("web/anthesis.pdf.manifest.json")
          metadata = json.loads(manifest_path.read_text(encoding="utf-8"))
          artifact_sha = hashlib.sha256(pdf.read_bytes()).hexdigest()

          assert pdf.read_bytes().startswith(b"%PDF-")
          assert pdf.stat().st_size > 10_000
          assert metadata["schema_version"] == 1
          assert metadata["artifact"] == "anthesis.pdf"
          assert metadata["artifact_sha256"] == artifact_sha
          assert metadata["source_commit"] == os.environ["EXPECTED_SOURCE_COMMIT"]
          assert metadata["manifest"] == "docs/anthesis/overview/whitepaper-manifest.json"
          assert metadata["sources"] == [
              {
                  "path": "docs/anthesis/overview/anthesis-whitepaper.md",
                  "sha256": metadata["sources"][0]["sha256"],
              }
          ]
          print(f"verified anthesis.pdf sha256:{artifact_sha}")
          PY
          test "$(pdfinfo web/anthesis.pdf | awk -F: '/^Title:/ {sub(/^[[:space:]]+/, "", $2); print $2}')" = \
            "Anthesis: Governed Execution for Agentic Systems"
          test "$(pdfinfo web/anthesis.pdf | awk -F: '/^Pages:/ {gsub(/[[:space:]]/, "", $2); print $2}')" -gt 0
          python scripts/validate_public_site.py

      - name: Commit generated publication
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/anthesis.pdf web/anthesis.pdf.manifest.json; then
            echo "Published artifact already matches the pinned source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/anthesis.pdf web/anthesis.pdf.manifest.json
          git commit -m "docs: publish curated Anthesis whitepaper"
          git push origin "HEAD:${GITHUB_REF_NAME}"
