name: Publication Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publication-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify current tracked source publication boundary
        run: python3 scripts/check_publication_security.py --tracked
      - name: Verify deployable web assets
        run: python3 scripts/check_publication_security.py --web
      - name: Test publication boundary rules
        run: python3 -m unittest discover -s test -p 'test_publication_security.py'
