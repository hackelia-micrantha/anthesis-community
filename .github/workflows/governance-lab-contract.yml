name: Governance Lab Contract

on:
  pull_request:
    paths:
      - "specs/governance-lab/**"
      - "scripts/validate_governance_lab_contract.py"
      - ".github/workflows/governance-lab-contract.yml"
  push:
    branches: [main]
    paths:
      - "specs/governance-lab/**"
      - "scripts/validate_governance_lab_contract.py"
      - ".github/workflows/governance-lab-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - run: python scripts/validate_governance_lab_contract.py
