name: Governance Lab Contract

on:
  pull_request:
    paths:
      - "specs/governance-lab/**"
      - "scripts/validate_governance_lab_contract.py"
      - "scripts/validate_promoted_governance_contracts.py"
      - ".github/workflows/governance-lab-contract.yml"
  push:
    branches: [main]
    paths:
      - "specs/governance-lab/**"
      - "scripts/validate_governance_lab_contract.py"
      - "scripts/validate_promoted_governance_contracts.py"
      - ".github/workflows/governance-lab-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.2" "jsonschema==4.23.0"
      - name: Validate schemas, strict YAML, digests, and decisions
        run: python scripts/validate_governance_lab_contract.py
      - name: Validate promoted evaluator contracts
        run: python scripts/validate_promoted_governance_contracts.py
